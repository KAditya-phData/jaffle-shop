# yaml-language-server: $schema=https://raw.githubusercontent.com/dbt-labs/dbt-jobs-as-code/main/src/dbt_jobs_as_code/schemas/load_job_schema.json
jobs:
  weekly_full_build:
    account_id: 17878
    project_id: 555006
    environment_id: 462450
    name: Weekly Full Build [[weekly_full_build]]
    job_type: scheduled
    settings:
      target_name: default
      threads: 4
    execution:
      timeout_seconds: 0
    run_generate_sources: false
    execute_steps:
    - dbt build --warn-error-options '{"error":["NoNodesForSelectionCriteria"]}'
    generate_docs: false
    triggers:
      github_webhook: false
      git_provider_webhook: false
      schedule: true
      on_merge: false
    description: Weekly scheduled dbt build that refreshes all models in STG.
    identifier: weekly_full_build
    schedule:
      cron: 0 6 * * 0
    cost_optimization_features:
    - state_aware_orchestration
  phdata_orders_rupees_daily:
    account_id: 17878
    project_id: 555006
    environment_id: 462450
    name: phdata_orders_rupees_daily [[phdata_orders_rupees_daily]]
    job_type: scheduled
    settings:
      target_name: staging
      threads: 4
    execution:
      timeout_seconds: 0
    run_generate_sources: false
    execute_steps:
    - dbt build --select +orders_rupees --warn-error-options '{"error":["NoNodesForSelectionCriteria"]}'
    generate_docs: false
    triggers:
      github_webhook: false
      git_provider_webhook: false
      schedule: true
      on_merge: false
    description: Daily build of orders_rupees and all upstream models
    identifier: phdata_orders_rupees_daily
    schedule:
      cron: 0 14 * * *
    cost_optimization_features:
    - state_aware_orchestration
  stg_customers_weekly:
    account_id: 17878
    project_id: 555006
    environment_id: 462450
    name: stg_customers_weekly [[stg_customers_weekly]]
    job_type: scheduled
    settings:
      target_name: staging
      threads: 4
    execution:
      timeout_seconds: 0
    run_generate_sources: false
    execute_steps:
    - dbt build --select stg_customers --warn-error-options '{"error":["NoNodesForSelectionCriteria"]}'
    generate_docs: false
    triggers:
      github_webhook: false
      git_provider_webhook: false
      schedule: true
      on_merge: false
    description: Weekly build of stg_customers
    identifier: stg_customers_weekly
    schedule:
      cron: 30 2 * * 1
    cost_optimization_features:
    - state_aware_orchestration
  on_merge_deploy:
    account_id: 17878
    project_id: 555006
    environment_id: 462450
    name: On Merge Deploy [[on_merge_deploy]]
    job_type: merge
    settings:
      target_name: staging
      threads: 4
    execution:
      timeout_seconds: 0
    deferring_environment_id: 462450
    run_generate_sources: false
    execute_steps:
    - dbt build --select state:modified+ --warn-error-options '{"error":["NoNodesForSelectionCriteria"]}'
    generate_docs: false
    triggers:
      github_webhook: false
      git_provider_webhook: false
      schedule: false
      on_merge: true
    description: 'Runs on every merge to main: builds changed models and their downstream dependents (state:modified+) in STG.'
    identifier: on_merge_deploy
    cost_optimization_features:
    - state_aware_orchestration
  pr_validation_testing_stg:
    account_id: 17878
    project_id: 555006
    environment_id: 462450
    name: PR Validation & Testing - Staging [[pr_validation_testing_stg]]
    job_type: ci
    settings:
      target_name: ci_pr_target
      threads: 8
    execution:
      timeout_seconds: 3600
    run_generate_sources: true
    execute_steps:
    - dbt build --select state:modified+ --warn-error-options '{"error":["NoNodesForSelectionCriteria"]}'
    generate_docs: true
    triggers:
      github_webhook: false
      git_provider_webhook: true
      schedule: false
      on_merge: false
    description: Automated CI pipeline triggered by pull requests to lint, build, and test modified models against the staging environment using state deferral.
    identifier: pr_validation_testing_stg
    deferring_environment_id: 462450
    triggers_on_draft_pr: true
    run_lint: true
    errors_on_lint_failure: true
    run_compare_changes: true
    compare_changes_flags: --select state:modified
    cost_optimization_features:
    - state_aware_orchestration
