# yaml-language-server: $schema=https://raw.githubusercontent.com/dbt-labs/dbt-jobs-as-code/main/src/dbt_jobs_as_code/schemas/load_job_schema.json
jobs:
  weekly_full_build:
    account_id: 17878
    project_id: 555006
    environment_id: 462450
    name: Weekly Full Build [[weekly_full_build]]
    job_type: scheduled
    settings:
      target_name: default
      threads: 4
    execution:
      timeout_seconds: 0
    run_generate_sources: false
    execute_steps:
    - dbt build --warn-error-options '{"error":["NoNodesForSelectionCriteria"]}'
    generate_docs: false
    triggers:
      github_webhook: false
      git_provider_webhook: false
      schedule: true
      on_merge: false
    description: Weekly scheduled dbt build that refreshes all models in STG.
    identifier: weekly_full_build
    schedule:
      cron: 0 6 * * 0
    cost_optimization_features:
    - state_aware_orchestration
